[build.env]
# The build container must inherit these compile-time OAuth credentials.
passthrough = [
    "SUMIDOKU_OAUTH_ANILIST_CLIENT_ID",
    "SUMIDOKU_OAUTH_ANILIST_CLIENT_SECRET",
    "SUMIDOKU_OAUTH_MAL_CLIENT_ID",
    "SUMIDOKU_OAUTH_MAL_CLIENT_SECRET",
    "SUMIDOKU_OAUTH_BANGUMI_CLIENT_ID",
    "SUMIDOKU_OAUTH_BANGUMI_CLIENT_SECRET",
    "SUMIDOKU_OAUTH_MANGABAKA_CLIENT_ID",
    "SUMIDOKU_OAUTH_MANGABAKA_CLIENT_SECRET",
]
