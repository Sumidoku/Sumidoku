[workspace]
members = ["crates/*", "vendor/aidoku"]
resolver = "3"

[workspace.package]
version = "0.5.0"

[workspace.dependencies]
aidoku = { path = "vendor/aidoku", default-features = false, features = ["imports"] }
wasmer = "7.5"
postcard = { version = "1.1", features = ["alloc"] }
plist = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
