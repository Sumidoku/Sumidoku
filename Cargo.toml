[workspace]
members = ["crates/*", "vendor/aidoku"]
resolver = "3"

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
aidoku = { path = "vendor/aidoku", default-features = false, features = ["imports"] }
wasmer = "6.1"
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "s"
lto = true
# rustc 1.95–1.97 的 llvm-objcopy strip 在 macOS 27 产出 dyld 拒载的 mis-aligned
# LINKEDIT dylib（rust-lang/rust#157750，1.98 修复）；none 对所有 toolchain 安全
strip = "none"
