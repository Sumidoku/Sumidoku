[workspace]
members = ["crates/*", "vendor/aidoku"]
resolver = "3"

[workspace.package]
version = "0.22.0"

[workspace.dependencies]
aidoku = { path = "vendor/aidoku", default-features = false, features = ["imports"] }
postcard = { version = "1.1", features = ["alloc"] }
plist = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# opt=3 + CU=1 + fat LTO: the (wasmi) interpreter's execution speed scales
# directly with host optimization (JIT is unaffected); measured 2.6x on a
# compile-heavy source workload (600 regex compiles 1505→575ms, the
# comparison matrix in wasmi-labs/wasmi#2059), at the cost of slower
# release builds
[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = true

# macOS's unpacked default runs dsymutil once per test binary after
# linking, and its memory scales with binary size (this repo has many test
# binaries statically linking big crates like boa, so one dsymutil can hit
# GB scale and a few in parallel reach tens of GB); with it off, debug
# symbols stay in the binary, lldb works as usual, and release (debug=0)
# is unaffected
[profile.dev]
split-debuginfo = "off"
