services:
  sumidoku:
    image: sumidoku/sumidoku:latest
    # 本地改从源码构建:先按 Dockerfile 顶部注释摆好 dist/ 布局,再
    # docker build -t sumidoku/sumidoku:latest .
    ports:
      - "3000:3000"
    volumes:
      - ./config:/config       # 数据库、设置、封面缓存、源包
      - ./downloads:/downloads
      - trawl-ca:/trawl-ca:ro  # TRAWL 共享 CA
    environment:
      - SUMIDOKU_NET_TRAWL_PROXY=http://trawl:8192
      - SUMIDOKU_NET_TRAWL_CA=/trawl-ca/ca.crt
      # - SUMIDOKU_NET_RELAY_DOMAINS=cf.example.com
      # 源登录用的真浏览器背衬；配合下方 chromium 服务（--profile browser）
      # - SUMIDOKU_NET_BROWSER_WS=ws://chromium:3000/chromium
      # 全站认证（web 界面/REST/OPDS 同一密码）
      # - SUMIDOKU_AUTH_PASSWORD=
      # - SUMIDOKU_AUTH_API_KEYS=key1,key2
    depends_on:
      - trawl

  trawl:
    image: ghcr.io/germondai/trawl:latest
    shm_size: 1gb
    environment:
      - MITM_ENABLED=true
      - MITM_PORT=8192
      - MITM_CA_DIR=/data/proxy-ca
      - MITM_MAX_TIER=3
      # 这套 compose 不带 redis，会话缓存落进程内存
      - SESSION_CACHE_DRIVER=memory
    volumes:
      - trawl-ca:/data/proxy-ca
      - trawl-data:/data
    # 不暴露端口，仅 compose 内网可达

  # 可选：webview 真浏览器背衬（源登录流程）。默认不拉起，
  # docker compose --profile browser up -d 才启动
  chromium:
    image: ghcr.io/browserless/chromium:latest
    profiles: ["browser"]
    shm_size: 1gb
    # 不暴露端口，仅 compose 内网可达；CDP ws 端点 ws://chromium:3000/chromium

volumes:
  trawl-ca:
  trawl-data:
