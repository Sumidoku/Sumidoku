name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    # gate the heavy legs: rust jobs skip web-only PRs, the web job skips rust-only PRs
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      # push events diff with git commands and need the checkout; PRs go through the API
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # some-with-excludes: a file must hit an include and no exclude —
          # under the default 'some' the '**' would swallow the exclusion
          predicate-quantifier: 'some-with-excludes'
          filters: |
            rust:
              # Markdown cannot change the executable or container; every other
              # non-webui path stays opted in so new build inputs cannot skip the gate.
              - '**'
              - '!webui/**'
              - '!**/*.md'
            web:
              - 'webui/**'
              - 'crates/server/assets/api-docs/openapi.json'

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # registry downloads only; compile caching is sccache's job.
          # target/ is never restored, so stale build-script outputs
          # (e.g. pkg-config probe results from another runner image)
          # cannot leak across runs
          cache-targets: "false"
      - uses: mozilla-actions/sccache-action@v0.0.11
      # --locked turns lock drift into a hard failure: a version bump or
      # dependency change that forgets to sync Cargo.lock is caught here
      # (the release pipeline without --locked silently regenerates it)
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: cargo nextest run --workspace

  build:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # compile-only gate on the platforms the release workflow ships, plus
    # windows for local dev builds; tests stay on ubuntu
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: cargo build --workspace --all-targets

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - run: git diff --exit-code -- src/api/types.ts
      - run: test -z "$(git status --porcelain -- src/api/types.ts)"
      - run: npm test
      - run: npm run check
      - run: npm run build

  docker:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
    # the embedded app depends on both server and web inputs; this is its only
    # end-to-end smoke leg
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Build web UI
        working-directory: webui
        run: npm ci && npm run build
      # rust-embed only bundles webui/build into a release build
      - run: cargo build --release -p sumidoku-server
      - run: mkdir -p dist/amd64 && cp target/release/sumidoku-server dist/amd64/
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: sumidoku:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        # this run is the only gate that the linked symbols still resolve on
        # the slim runtime's glibc
        run: |
          trap 'docker logs sumidoku' ERR
          docker run -d --name sumidoku -p 3000:3000 sumidoku:test
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health > /dev/null && break || sleep 2
          done
          # the bundled web UI is served at /
          curl -sf http://localhost:3000/ | grep -q "<title>Sumidoku</title>"
          # the API is up and the database answers
          curl -sf http://localhost:3000/api/v1/settings
          curl -sf http://localhost:3000/api/openapi.json | jq -e '.openapi and (.paths["/api/v1/sync/changes"] != null)' > /dev/null
          curl -sf http://localhost:3000/api/docs | grep -q "SwaggerUIBundle"

  ci:
    # the single check branch protection pins: a matrix leg skipped by the
    # job-level if reports under one bare name, so requiring the expanded
    # "build (os)" names blocks every web-only PR on a check that never runs
    needs: [lint, test, build, web, docker]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Every leg passed or was filtered out
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          [ -z "$failed" ] || { echo "red legs: $failed"; exit 1; }
          echo "all legs green or filtered out"
