[package]
name = "aidoku-wasm"
version.workspace = true
description = "Aidoku WASM source runtime for Sumidoku"
edition = "2024"
publish = false

[dependencies]
aidoku.workspace = true
# production only feeds .wasm binaries (WAT test fixtures go through the dev-dependencies wat crate), so the wat feature is pure bloat
wasmi = { version = "2.0", default-features = false, features = ["stable", "std", "validate", "memory64", "auto-dispatch"] }
image = "0.25"
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono = "0.4"
chrono-tz = "0.10"
# chrono::Local cannot provide the IANA name, and parse_date must resolve the local timezone as chrono_tz::Tz
iana-time-zone = "0.1"
ego-tree = "0.11"
# Origin of the types in scraper's public signatures (Element::new/Attribute/QualName), needed for attr writes
html5ever = "0.40"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "cookies", "gzip", "brotli", "deflate", "http2"] }
encoding_rs = "0.8"
# full HTML5 named + numeric character reference decoding for the html.unescape host import
html-escape = "0.3"
scraper = { version = "0.29", features = ["atomic"] }
regex = "1"
url = "2.5"
zip = { version = "9", default-features = false, features = ["deflate"] }
boa_engine = "0.22"
tiny-skia = "0.12"
fontdb = "0.24"
ttf-parser = "0.25"

[dev-dependencies]
tracing-subscriber.workspace = true
# Compressed-body test fixtures: same implementation as reqwest's transitive one, version aligned with Cargo.lock
brotli = "9"
flate2 = "1"
# fuel-semantics tests compile a WAT guest on the fly: comes in transitively via wasmi, adds no new crate to the dependency tree
wat = "1"
