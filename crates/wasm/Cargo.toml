[package]
name = "aidoku-wasm"
version.workspace = true
description = "Aidoku WASM source runtime for Sumidoku"
edition = "2024"
publish = false

[dependencies]
aidoku.workspace = true
wasmer.workspace = true
wasmer-middlewares = "7.5"
wasmer-compiler = "7.5"
image = "0.25"
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono = "0.4"
chrono-tz = "0.10"
ego-tree = "0.11"
# scraper 公共签名（Element::new/Attribute/QualName）本身的类型出处，attr 写入要用
html5ever = "0.39"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "cookies", "gzip", "brotli", "deflate"] }
encoding_rs = "0.8"
scraper = { version = "0.27", features = ["atomic"] }
url = "2.5"
zip = { version = "9", default-features = false, features = ["deflate"] }
boa_engine = "0.21"
chromiumoxide = { version = "0.9", default-features = false }
futures = "0.3"
tiny-skia = "0.12"
fontdb = "0.24"
ttf-parser = "0.25"

[dev-dependencies]
tracing-subscriber.workspace = true
