[package]
name = "aidoku-wasm"
version.workspace = true
description = "Aidoku WASM source runtime for Sumidoku"
edition = "2024"
publish = false

[dependencies]
aidoku.workspace = true
wasmi = "2.0"
image = "0.25"
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono = "0.4"
chrono-tz = "0.10"
# chrono::Local 拿不到 IANA 名，而 parse_date 要按 chrono_tz::Tz 落本地时区
iana-time-zone = "0.1"
ego-tree = "0.11"
# scraper 公共签名（Element::new/Attribute/QualName）本身的类型出处，attr 写入要用
html5ever = "0.39"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "cookies", "gzip", "brotli", "deflate", "http2"] }
encoding_rs = "0.8"
scraper = { version = "0.27", features = ["atomic"] }
regex = "1"
url = "2.5"
zip = { version = "9", default-features = false, features = ["deflate"] }
boa_engine = "0.21"
tiny-skia = "0.12"
fontdb = "0.24"
ttf-parser = "0.25"

[dev-dependencies]
tracing-subscriber.workspace = true
# 压缩体测试夹具：与 reqwest 传递引入的同一实现，版本对齐 Cargo.lock
brotli = "9"
flate2 = "1"
# fuel 语义测试现编 WAT guest：wasmi 传递引入，不向依赖树新增 crate
wat = "1"
