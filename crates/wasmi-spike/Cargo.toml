[package]
name = "wasmi-spike"
version.workspace = true
description = "Time-boxed wasmi evaluation host for issue #169 (not for merge)"
edition = "2024"
publish = false

[dependencies]
aidoku.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
wasmer.workspace = true
wasmer-middlewares = "7.5"
wasmer-compiler = "7.5"
wasmi = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli", "deflate", "http2"] }
url = "2.5"
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"
libc = "0.2"
wat = "1"

[dev-dependencies]
tracing-subscriber.workspace = true
