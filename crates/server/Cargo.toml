[package]
name = "sumidoku-server"
version.workspace = true
description = "Sumidoku manga server"
edition = "2024"
publish = false

[dependencies]
aidoku-wasm = { path = "../wasm" }
aidoku.workspace = true
plist.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { version = "0.8", features = ["ws", "multipart"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros", "chrono", "json"] }
chrono = "0.4"
toml = "1.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "http2"] }
rust-embed = { version = "8", features = ["debug-embed", "mime-guess"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
# suwayomi/mihon backup decoding: flate2 is already pulled in by zip/reqwest, no new crate added to the dependency tree
# (miniz_oxide pure-Rust backend, no cross-compilation risk)
prost = "0.14"
flate2 = "1"
# where the Stream trait for axum Body::from_stream comes from; no transitive dependencies
futures-core = "0.3"
# login host parsing (the wasm crate already depends on it, no new crate added to the dependency tree)
url = "2.5"
# password hashing (pure Rust, no C-dependency cross-compilation risk); sha2 for token/API key fingerprints
argon2 = "0.5"
sha2 = "0.11"
# the rand_core re-exported by password-hash doesn't enable OsRng by default; depending on it directly enables getrandom to unify features
rand_core = { version = "0.6", features = ["getrandom"] }
# base64url encoding for the PKCE code_challenge (the reqwest family already pulls in 0.22, no new version added)
base64 = "0.22"
# page image downsampling (the wasm crate is also on 0.25, versions align naturally)
image = "0.25"
# ComicInfo.xml/OPF parsing; overlapped-lists allows role refinements between creators
quick-xml = { version = "0.42", features = ["serialize", "overlapped-lists"] }

# RSS reading (macOS task_info / Linux _SC_PAGESIZE); libc is pulled in transitively by many dependencies, no new crate
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# local TLS+ALPN-h2 echo (the h2 negotiation test in routed.rs): rustls uses ring, consistent with
# the backend reqwest already pulls in, and rcgen keeps only ring; all pure Rust, not in the release binary
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
