[package]
name = "sumidoku-server"
version.workspace = true
description = "Sumidoku manga server"
edition = "2024"
publish = false

[dependencies]
aidoku-wasm = { path = "../wasm" }
aidoku.workspace = true
plist.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { version = "0.8", features = ["ws"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros", "chrono", "json"] }
chrono = "0.4"
toml = "1.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "http2"] }
rust-embed = { version = "8", features = ["debug-embed", "mime-guess"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
# suwayomi/mihon 备份解码：prost 由 wasmer 系带入、flate2 由 zip/reqwest 带入，
# 两个直接依赖不向依赖树新增任何 crate（miniz_oxide 纯 Rust 后端，无交叉风险）
prost = "0.14"
flate2 = "1"
# axum Body::from_stream 的 Stream trait 出处，无传递依赖
futures-core = "0.3"
# 登录 host 解析（wasm crate 已依赖，不向依赖树新增 crate）
url = "2.5"
# 密码哈希（纯 Rust，无 C 依赖交叉风险）；token/API key 指纹用 sha2
argon2 = "0.5"
sha2 = "0.11"
# password-hash 重导出的 rand_core 默认没开 OsRng，直接依赖开 getrandom 统一特性
rand_core = { version = "0.6", features = ["getrandom"] }
# PKCE code_challenge 的 base64url 编码（reqwest 系已带入 0.22，不新增版本）
base64 = "0.22"
# 页图降采样（wasm crate 同为 0.25，版本自然对齐）
image = "0.25"

# RSS 读取（macOS task_info / Linux _SC_PAGESIZE）；libc 由大量依赖传递带入，不新增 crate
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# 本地 TLS+ALPN-h2 echo（routed.rs 的 h2 协商测试）：rustls 走 ring 与 reqwest 已引入的
# 后端一致，rcgen 只留 ring；全部纯 Rust，不进 release 二进制
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
